# Local Postgres for development only. Dev and prod data live in Supabase; the
# integration suite brings its own database via testcontainers.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence
      POSTGRES_DB: cadence
    ports:
      - "5433:5432"
    volumes:
      - cadence-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d cadence"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cadence-pgdata:
