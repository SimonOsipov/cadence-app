# The local development stack. Everything a feature needs to be built and tried
# on this machine.
#
# Not only this machine any more, and the header used to say otherwise: the mail
# block below carries the product's own choices — the link lifetime, two rate
# limits, three subjects, three template URLs, the sender name and the redirect
# allow list — because the real instance is provisioned outside this repository
# and this file is the only copy a test can read. The fast gate reads them as the
# deployment.
#
# The integration suite does not use any of this — it brings its own Postgres
# through testcontainers, so a test run cannot be contaminated by whatever state
# a development session left behind.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence
      POSTGRES_DB: cadence
    ports:
      - "5433:5432"
    volumes:
      - cadence-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence -d cadence"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The identity provider, locally. Every path behind /v1 needs a token, so
  # without this there is nothing to build a login screen against and nothing to
  # test an authenticated endpoint with. It is the same GoTrue that will run in
  # the deployment (ADR-008) — the difference is only who hosts it.
  # What GoTrue's own migrations assume exists before they run, and do not
  # create themselves. Two surprises, both of which will repeat on the
  # deployment and are therefore worth meeting here first:
  #
  #   - the `auth` schema. GoTrue migrates it but does not create it, and dies
  #     with "schema auth does not exist" if it is missing.
  #   - a set of roles from Supabase's own environment. Its migrations hand out
  #     grants to `postgres`, `anon`, `authenticated` and friends, and a plain
  #     Postgres has none of them. They are created NOLOGIN and hold nothing;
  #     they exist so the grants have a target.
  #
  # None of them is one of ours. The roles the request path impersonates —
  # cadence_patient, cadence_doctor, cadence_admin — are created by
  # api/migrations, and nothing here grants anything to the names above.
  #
  # This step also creates the role GoTrue connects as. It is created here and
  # not by api/migrations because it is not part of the application schema: the
  # chain owns `app` and the roles that reach it, and the identity provider's
  # database user belongs to whoever deploys the identity provider. What the
  # chain does own is the other end of the connection — `cadence_auth_hook`,
  # the role the hook's EXECUTE is granted to — and `make dev-up` grants the
  # membership between the two once the chain has run.
  #
  # The password is set here rather than by `dev-up`, unlike the two LOGIN roles
  # the chain creates. GoTrue starts as soon as compose brings it up and
  # connects immediately, which is before `dev-up` reaches its psql step; a role
  # without a password at that moment is a container that exits and stays exited:
  # `auth` declares no restart policy, so nothing retries it. The deployment has
  # no such ordering problem — the credential is in its variable store before
  # anything starts.
  #
  # A one-shot step rather than an entrypoint init script, because init scripts
  # only run when the data volume is first created: this way a developer with an
  # existing volume gets the same result as a fresh clone. Everything below is
  # therefore written to converge rather than to create — including the password,
  # which a `WHERE NOT EXISTS` guard would leave at whatever an older volume had.
  #
  # The ownership sweep is there for the same reason, and it covers more than
  # tables: on a volume where GoTrue once migrated as the superuser, `auth` also
  # holds functions (auth.uid, auth.role, …) and enum types (factor_type,
  # aal_level, …) owned by `cadence`, and a version bump that runs
  # CREATE OR REPLACE FUNCTION or ALTER TYPE … ADD VALUE is refused on those
  # exactly as it would be on a table.
  auth-schema:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      # No dollar-quoted block on purpose: compose reads `$$` as an escaped
      # dollar and psql would receive a single one. `\gexec` runs each row of
      # the result as its own statement, which needs no quoting at all.
      - |
        PGPASSWORD=cadence psql -v ON_ERROR_STOP=1 -h postgres -U cadence -d cadence <<'SQL'
        SELECT format('CREATE ROLE %I', 'cadence_gotrue')
         WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'cadence_gotrue')
        \gexec
        ALTER ROLE cadence_gotrue LOGIN PASSWORD 'cadence_gotrue'
                                  NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
        CREATE SCHEMA IF NOT EXISTS auth AUTHORIZATION cadence_gotrue;
        ALTER SCHEMA auth OWNER TO cadence_gotrue;
        -- Tables, sequences and views, then functions, then the types GoTrue
        -- declares (enums and domains — a table's own row type follows its
        -- table and must not be named here).
        --
        -- A sequence a column owns follows its table and cannot be reassigned on
        -- its own: Postgres answers "Sequence is linked to table", which with
        -- ON_ERROR_STOP=1 would take the whole step down. Hence the pg_depend
        -- filter — measured, not anticipated.
        SELECT format('ALTER %s auth.%I OWNER TO cadence_gotrue',
                      CASE c.relkind WHEN 'S' THEN 'SEQUENCE'
                                     WHEN 'v' THEN 'VIEW'
                                     WHEN 'm' THEN 'MATERIALIZED VIEW'
                                     ELSE 'TABLE' END, c.relname)
          FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
         WHERE n.nspname = 'auth' AND c.relkind IN ('r', 'p', 'S', 'v', 'm')
           AND c.relowner <> 'cadence_gotrue'::regrole
           AND NOT EXISTS (
                 SELECT FROM pg_depend d
                  WHERE d.classid = 'pg_class'::regclass AND d.objid = c.oid
                    AND d.deptype IN ('a', 'i'))
        \gexec
        SELECT format('ALTER FUNCTION auth.%I(%s) OWNER TO cadence_gotrue',
                      p.proname, pg_get_function_identity_arguments(p.oid))
          FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace
         WHERE n.nspname = 'auth' AND p.proowner <> 'cadence_gotrue'::regrole
        \gexec
        SELECT format('ALTER TYPE auth.%I OWNER TO cadence_gotrue', t.typname)
          FROM pg_type t JOIN pg_namespace n ON n.oid = t.typnamespace
         WHERE n.nspname = 'auth' AND t.typtype IN ('e', 'd')
           AND t.typowner <> 'cadence_gotrue'::regrole
        \gexec
        SELECT format('CREATE ROLE %I NOLOGIN', r)
          FROM unnest(ARRAY[
                 'postgres', 'anon', 'authenticated', 'service_role',
                 'supabase_auth_admin', 'supabase_admin', 'authenticator', 'dashboard_user'
               ]) AS r
         WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = r)
        \gexec
        SQL
    restart: "no"

  auth:
    # Pinned by digest, not by tag: the trust boundary model rests on three
    # measured-and-undocumented GoTrue behaviours (see verifier_test.go and
    # SKL step-2's contract tests), so an image upgrade must run into those
    # tests rather than silently carry the foundation away. The tag is kept
    # in the comment for a human resolving the digest back to a release; only
    # the digest is what compose pulls.
    #
    #   docker pull supabase/gotrue:v2.194.0
    #   docker inspect supabase/gotrue:v2.194.0 --format '{{index .RepoDigests 0}}'
    #
    # Verified 2026-08-13: the digest below is the multi-arch manifest list
    # for v2.194.0, not a single platform's manifest, so it resolves
    # correctly on both amd64 (deployment) and arm64 (Apple Silicon dev
    # machines).
    image: supabase/gotrue@sha256:2b352c02adf11a2025cd5993c246ef85db73743553c39194d2b1862d1cc4d1fd
    depends_on:
      postgres:
        condition: service_healthy
      auth-schema:
        condition: service_completed_successfully
      # Not decoration: a template fetched before nginx answers falls back to the
      # English default for that entry, and the fallback is silent.
      mail-templates:
        condition: service_healthy
    ports:
      - "9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      PORT: "9999"

      # Its own schema, created and migrated by GoTrue itself. The chain in
      # api/migrations owns `app` and never touches this one.
      GOTRUE_DB_DRIVER: postgres
      # Both, and they do different jobs: DB_NAMESPACE tells the migrator where
      # to create tables, `search_path` tells the running server where to find
      # them. GoTrue's runtime queries are unqualified — `select ... from
      # identities` — so with only the first it migrates cleanly and then fails
      # every request with `relation "identities" does not exist`.
      # `public` stays on the path for extension functions.
      GOTRUE_DB_NAMESPACE: auth
      # cadence_gotrue, not the container's superuser. The identity provider is
      # the one process here that is reachable from outside without a token, and
      # a superuser connection would make a bug in it a bug in every table:
      # BYPASSRLS ignores every policy the chain writes. What this role can do to
      # the application schema is exactly one function call — see the membership
      # granted by `make dev-up`.
      DATABASE_URL: postgres://cadence_gotrue:cadence_gotrue@postgres:5432/cadence?sslmode=disable&search_path=auth,public

      # Standalone GoTrue serves its API at the root — the /auth/v1 prefix seen
      # on Supabase comes from their gateway, not from this process. So the
      # issuer is the bare origin, and the JWK Set lands at
      # {issuer}/.well-known/jwks.json, which is exactly what config.loadAuth
      # derives from AUTH_JWT_ISSUER.
      API_EXTERNAL_URL: http://localhost:9999
      GOTRUE_JWT_ISSUER: http://localhost:9999
      GOTRUE_SITE_URL: http://localhost:8080
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_EXP: "3600"

      # GoTrue refuses to start without this even when JWT_KEYS is set; it
      # signs nothing here.
      GOTRUE_JWT_SECRET: local-development-only-not-a-secret

      # `key_ops: ["sign"]` picks the signing key — GoTrue refuses to start
      # with none or with more than one. The second kid is the admin key,
      # deliberately absent from AUTH_JWT_SESSION_KIDS; config.Load refuses to
      # start if it is ever added there. Both pairs are development-only and
      # committed on purpose.
      GOTRUE_JWT_KEYS: '[{"kty":"EC","crv":"P-256","alg":"ES256","use":"sig","kid":"a1323fc3-c42d-37ae-8be6-1ebfb524403f","x":"2e9iv7Gxg80pCO61rNEtPEs-mIr1mErwg8vW7QcugY8","y":"9K6Q4xt--k5fF48WfBjVeFnxsn3NAJY-so03DMZnEH0","d":"oTI_w8QtN66L5h6_tSRAP5I4FbDa13nXQrT2KWM3fuQ","key_ops":["sign"]},{"kty":"EC","crv":"P-256","alg":"ES256","use":"sig","kid":"xr8-HA0zUfG0zdB40mJdFNwX3DvkinwdnhXB1g2W_Dw","x":"rtiaY2jMvLAFdxMFASN2GZ5EigwL4ka3TjAb4Yz_wE8","y":"ye74OWWh2AjB4jPLni3z3OIpByWz2QCh-u7N7DachxM","d":"XPA_FXtwbdWb0sxa9Dr7MZdKQboGjZA4jfvFhfvTIBA"}]'

      # The token issuance hook. This is the one place the product role gets into
      # a token: GoTrue calls app.access_token_hook while minting an access
      # token, and the seam on the other side reads cadence_role out of the
      # claims and picks a Postgres role from a closed map.
      #
      # `pg-functions://postgres/<schema>/<function>`. The scheme is what selects
      # the dispatcher; the host segment — `postgres` here — is parsed and then
      # ignored by v2.194.0, and is neither a role, a database nor a driver.
      # Only the two path segments are read. GoTrue calls the function over its
      # own connection, which is why the EXECUTE granted to cadence_auth_hook has
      # to reach cadence_gotrue through a membership.
      #
      # Without ENABLED the URI is read and ignored, and every token comes out
      # correctly signed and without a product role — which the API answers with
      # a refusal that names the seam rather than the configuration. Worth
      # knowing before the same variable is set on a deployment.
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: pg-functions://postgres/app/access_token_hook

      # Invite-only. Invariant 3 of the identity note, not a local convenience:
      # an account exists because a clinic invited it.
      GOTRUE_DISABLE_SIGNUP: "true"

      # How long an invitation link works. Chosen to survive a weekend, and read
      # back by identity.InviteLinkLifetime, which is what the pending state is
      # derived from — nothing stores an invitation's status. A test fails when
      # the two stop agreeing.
      #
      # The three mail settings here are the exception to the header: they are
      # the product's choice rather than this machine's, and the real instance is
      # provisioned outside this repository. What a test can reach is this file,
      # so this is where the choice is recorded — and a deployment left on the
      # provider's defaults is a gap nothing here can see.
      GOTRUE_MAILER_OTP_EXP: "259200"

      # The shortest gap between two emails to one person. It covers /recover,
      # which is public and therefore the one mail route a stranger can ask for;
      # the admin /invite is not covered by it at all — measured, see
      # TestTheAdminInviteIsNotCoveredByThePerAddressGap. Nothing on our side
      # bounds invitations either, so the quota below is the only limit /invite
      # has.
      #
      # SMTP_, not MAILER_, and the wrong name is silent: the measurement is on
      # testsupport.MailerMaxFrequencyVariable, which is the name a test reads
      # this line for.
      GOTRUE_SMTP_MAX_FREQUENCY: 1m

      # Emails per hour for the whole instance, and the only limit that reaches
      # /invite: the measurement is on testsupport.EmailsPerHourVariable.
      #
      # It counts the clinic rather than the doctor, so it cannot tell one
      # doctor's loop from the rest of the staff working — it refuses everybody
      # at once. The per-doctor limit that would have is not built. The ceiling
      # is somebody else's and is not known here: the SMTP provider is SKL-01
      # and has not been chosen, so this number bounds the clinic and not the
      # sending domain.
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "200"

      # The clinic's own mail, in the product's language. Left unset every one
      # of these is the provider's English default, and the defaults are what a
      # patient would receive.
      #
      # These are HTTP URLs because v2.194.0 fetches a template and cannot read
      # one off disk, and a failed fetch is silent at startup and throws away
      # the SUBJECTS_ lines above with the body. Both readings of the pinned
      # image's source are written down beside the test that acts on them:
      # TestEveryMailTemplateIsFetchableByScheme in mail_test.go. That test
      # checks the scheme and not reachability, so a wrong host still ships.
      #
      # This covers the mail and nothing else: the provider's own error strings
      # and the page a refused link lands on stay English, with no key to
      # translate them. Deferred to the client surfaces, which read the error
      # code rather than the sentence and write their own copy.
      GOTRUE_SMTP_SENDER_NAME: Клиника Cadence
      GOTRUE_MAILER_SUBJECTS_INVITE: Приглашение в Cadence
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Вход в Cadence
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Восстановление доступа к Cadence
      GOTRUE_MAILER_TEMPLATES_INVITE: http://mail-templates/invite.html
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://mail-templates/magic-link.html
      GOTRUE_MAILER_TEMPLATES_RECOVERY: http://mail-templates/recovery.html

      # Where a link is allowed to land, per environment: the addresses the
      # patient app and the dashboard answer on differ per deployment, and the
      # real instance is provisioned outside this repository exactly as the mail
      # settings above are. What an uncovered address costs is named at
      # TestTheAllowListDecidesWhereALinkLands.
      #
      # The value below opens nothing: it is SITE_URL's own origin, so locally
      # the list is the fallback. That is not a choice — this machine has no
      # surface to land on yet. The dashboard in web/ is still a prototype with
      # no dev server, and the app's deep-link scheme is not chosen. Whoever
      # adds either owns replacing this line.
      GOTRUE_URI_ALLOW_LIST: http://localhost:8080/**
      # A bare `**` would open this to any host the caller names, and the
      # session rides in the landing address's fragment. Asserted in shape,
      # not merely in non-emptiness — see TestTheDeploymentSetsARedirectAllowList.

      # No mail server locally: with no SMTP account configured the provider sends
      # nothing, and the flow is walked by reading the token out of auth.users the
      # way the integration harness does. Whether it also logs the link is not
      # measured by anything here.
      #
      # What this setting itself does is confirm the account on signup.
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_LOG_LEVEL: debug

  # The templates GoTrue renders, served over HTTP because that is the only way
  # it will take them. Not proxied outward and holding nothing: it answers three
  # static files on the compose network. The same shape the deployment needs —
  # an internal service, never the first one in the manifest.
  mail-templates:
    image: nginx:1.29-alpine
    volumes:
      - ./mail-templates:/usr/share/nginx/html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/invite.html"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  cadence-pgdata:
