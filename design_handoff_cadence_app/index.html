<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Cadence — Interactive prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="design-system/colors_and_type.css" />
<style>
  html, body { margin: 0; background: #2a2a2a; }
  body { font-family: var(--font-body); }
  .ds-scroll { -webkit-overflow-scrolling: touch; }
  .ds-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .press { transition: transform 120ms var(--ease-spring); }
  .press:active { transform: scale(0.98); }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* Entrance animations — transform only so content stays visible if animations are frozen */
  @keyframes sheetUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  @keyframes scrim {
    from { opacity: 0.001; }
    to   { opacity: 1; }
  }
  .sheet { animation: sheetUp 360ms var(--ease-out); }
  .scrim { animation: scrim 220ms ease-out; }
  @keyframes tickIn {
    from { stroke-dashoffset: 24; }
    to   { stroke-dashoffset: 0; }
  }
  .tick path { stroke-dasharray: 24; animation: tickIn 360ms var(--ease-out) forwards; }
  @keyframes fadeUp {
    from { transform: translateY(6px); }
    to   { transform: translateY(0); }
  }
  .fade-up { animation: fadeUp 280ms var(--ease-out); }
  @keyframes fadeIn { from { opacity: 0.001; } to { opacity: 1; } }
  .fade-in { animation: fadeIn 260ms var(--ease-out); }
  @keyframes pulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.1); }
  }
  .pulse { animation: pulse 1800ms ease-in-out infinite; }
  @keyframes wavebar {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1.4); }
  }
  @keyframes slideInR {
    from { transform: translateX(12px); }
    to   { transform: translateX(0); }
  }
  .slide-r { animation: slideInR 280ms var(--ease-out); }
  .tod-chip { transition: all 180ms var(--ease-out); }
</style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script src="learn/image-slot.js"></script>

</body>
</html>
