# Single source of truth for every version in the mobile build. Nothing here is
# a range: a reproducible build is worth more than an automatic upgrade.
#
# No material3: the design system is ported from the frozen Expo prototype
# (mobile/src/theme), not taken from Material. Only the Compose primitives are
# needed here.
#
# navigation-compose is the one library taken rather than ported. Unlike the
# Material widgets, what it carries is not a look — it is back-stack ownership,
# saved state across process death and the platform back gesture, and a
# hand-rolled stack would have to reimplement all three before the first screen
# lands. Type-safe routes are why kotlinx-serialization comes with it.

[versions]
agp = "9.3.1"
kotlin = "2.4.10"
ktlint-plugin = "14.2.0"
ktlint-tool = "1.8.0"
detekt = "1.23.8"
compose-multiplatform = "1.11.1"
androidx-activity-compose = "1.13.0"
# Stable, not the 2.10.0-alpha line: the alpha pulls lifecycle 2.11.0-beta01
# and compose 1.10.0 transitively, and nothing here needs what it adds.
navigation-compose = "2.9.2"
kotlinx-serialization = "1.11.0"

android-minSdk = "28"
android-targetSdk = "36"
android-compileSdk = "36"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "compose-multiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "compose-multiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "compose-multiplatform" }
compose-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "compose-multiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "compose-multiplatform" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose-multiplatform" }
navigation-compose = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation-compose" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinx-serialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Versioned with the compiler, not independently: the serialization plugin is a
# Kotlin compiler plugin and only ever matches its own compiler.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-plugin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
