version: "2"

run:
  # The integration suite is behind this tag, so `go build ./...` and `go vet`
  # never look at it. The linter does: tagged code that does not compile has to
  # fail the fast gate, not wait for the one job that has a Docker daemon.
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - bodyclose
    - depguard
    - errorlint
    - gosec
    - noctx
  settings:
    gosec:
      # The backstop, not the rule. G201 and G202 match on SQL keywords, so they
      # see a formatted SELECT and miss a concatenated SET ROLE entirely — and
      # SET ROLE is the statement this codebase would compose if anything did.
      # The authorship check in scripts/gate/go.sh is what covers that; these two
      # are kept on because a second opinion on the shapes they do recognise
      # costs nothing.
      #
      # Restricted to the two rules on purpose: the rest of gosec's catalogue is
      # a separate decision, and enabling it as a side effect of this one would
      # be a change nobody reviewed.
      includes:
        - G201
        - G202
    errcheck:
      check-type-assertions: true
    depguard:
      rules:
        # testsupport builds databases, mints keys and will grow token helpers.
        # A build tag already keeps it out of a normal build; this keeps it out
        # of production code even when someone builds with the tag. The rule
        # against an authentication bypass in the application is then a
        # mechanism rather than an intention.
        no-test-harness-in-production:
          files:
            - "!$test"
          deny:
            - pkg: github.com/SimonOsipov/cadence-app/api/internal/platform/testsupport
              desc: the test harness is reachable from _test.go files only
        # Two credentials in this module travel in a request header: the admin
        # token the provisioner mints, and the shared secret the API presents to
        # it. httputil.DumpRequest and DumpRequestOut render every header, so one
        # line of debugging writes either of them into the log — where they
        # outlive the session, get shipped to whatever collects logs, and are
        # unrecoverable once there.
        #
        # Tests included: a dump in a test is the same value in the same CI log.
        no-request-dumps:
          deny:
            - pkg: net/http/httputil
              desc: DumpRequest renders the Authorization and shared-secret headers into the log

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gofumpt:
      extra-rules: true
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/SimonOsipov/cadence-app/api)
